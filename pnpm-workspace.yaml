# =============================================================================
# Рабочее пространство pnpm
#
# Репозиторий разделён на запускаемые приложения и переиспользуемые библиотеки:
#   apps/api, apps/worker, apps/autoscaler — серверные приложения;
#   apps/web                               — интерфейс на Vite + React;
#   packages/*                             — библиотеки, которые они делят.
#
# Корневой пакет — только workspace-корень: в нём не осталось ни исходников,
# ни рантайм-зависимостей, только инструменты разработки. Так границы видны
# по манифестам: воркер больше не зависит от @nestjs/*, а автоскейлер — от minio.
# =============================================================================

packages:
  - 'apps/*'
  - 'packages/*'

# =============================================================================
# Каталог версий общих зависимостей
#
# Здесь объявляются версии пакетов, которые встречаются больше чем в одном
# манифесте. Пакеты ссылаются на них протоколом `catalog:` вместо диапазона,
# поэтому версия правится в одном месте и не может разойтись между сторонами.
#
# Каталог заведён не «на всякий случай»: `typescript` до него был объявлен
# тремя разными диапазонами (^5.9.3 в корне, ^5.9.0 в web и контракте) —
# то есть сборки уже шли разными компиляторами. Для `zod` расхождение опаснее
# рассогласования сборок: схемы контракта исполняет сервер, и две копии
# валидатора в одном процессе ломают проверку типов на `instanceof`
# и удваивают разбор.
#
# Зависимости, объявленные ровно в одном манифесте, сюда не выносятся:
# каталог добавляет им косвенность, ничего не защищая.
# =============================================================================
catalog:
  # Разбирает и сервер, и контракт: одна копия на процесс
  zod: ^4.6.5
  # Компилятор один на все пакеты — иначе расходятся Diagnostics
  typescript: ^5.9.3
  # Типы Node общие для сервера и веба
  '@types/node': ^26.6.3
  # Движок браузерной конвертации объявлен дважды: пакет `office` им работает,
  # а тесты корня сверяют с его формулами наши копии (прямоугольник прогона
  # в `pdf/geometry.ts`). Версия одна: разойтись ей нельзя — сверка потеряет
  # смысл, если стороны будут из разных сборок
  '@betteroffice/docx': 0.3.0

# Сборка нативных модулей разрешена только этим пакетам.
#
# @swc/core — транспилятор для тестов на Vitest; ставит платформенный бинарник.
# msgpackr-extract — опциональный ускоритель BullMQ; при отсутствии
# prebuild-сборки он откатывается на чистый JS и не ломает установку.
allowBuilds:
  '@swc/core': true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@betteroffice/docx@0.3.0'
  - '@betteroffice/fonts-cjk@0.3.0'
  - '@betteroffice/fonts@0.3.0'
  - '@betteroffice/xlsx@0.3.0'
  - decode-uri-component@0.4.3

# stream-json намеренно не переопределяется.
#
# Аудит видит в 1.x уязвимость GHSA-528h-pc64-c93x (фильтры
# pick/ignore/filter/replace разбирают вложенный JSON за O(depth²)), и
# закрыта она только в 3.5.0. Но подставить 3.x нельзя: minio@8.0.7 —
# последняя на момент правки — берёт из пакета только потоковый разбор
# JSON-строк (`stream-json/jsonl/Parser.js`, метод `make`), а в 3.x этот
# файл переехал в `src/jsonl/parser.js` и переписан на ESM без `make`.
# Подмена ломала импорт на регистрозависимой файловой системе: в CI —
# `Cannot find module '.../stream-json/src/jsonl/Parser.js'`, в проде —
# отказ при загрузке хранилища. Уязвимая часть (фильтры) в дереве
# зависимостей не используется: единственный потребитель stream-json —
# minio, и он их не импортирует.
overrides:
  decode-uri-component@<=0.4.2: ^0.5.0
