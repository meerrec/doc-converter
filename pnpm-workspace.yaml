# =============================================================================
# Рабочее пространство pnpm
#
# Корневой пакет — серверная часть (api + worker). Рядом живут:
#   packages/contract — общий контракт API: zod-схемы и выведенные из них типы,
#                       которые потребляют и сервер, и веб-интерфейс;
#   web               — интерфейс на Vite + React.
#
# Веб переведён в workspace после удаления isolated-vm: раньше он держался
# на отдельном npm-сторе именно из-за нативного модуля.
# =============================================================================

packages:
  - 'packages/*'
  - 'web'

# Сборка нативных модулей разрешена только этим пакетам.
#
# @swc/core — транспилятор для тестов на Vitest; ставит платформенный бинарник.
# msgpackr-extract — опциональный ускоритель BullMQ; при отсутствии
# prebuild-сборки он откатывается на чистый JS и не ломает установку.
allowBuilds:
  '@swc/core': true
  msgpackr-extract: true
