# =============================================================================
# Конфигурация сайта конвертера: nginx — единственная точка входа, отдаёт
# статику и проксирует запросы к API. Благодаря этому фронтенд и API
# находятся на одном origin, и CORS (который у сервиса включается только
# в режиме development) не нужен.
#
# Это НЕ самостоятельный конфиг: файл копируется в
# /opt/app-root/etc/nginx.default.d/ образа ubi9/nginx-126 и подключается
# внутрь server-блока штатного nginx.conf (include .../nginx.default.d/*.conf).
# Поэтому здесь нет ни `server`, ни `listen`, ни `root` — их задаёт штатный
# конфиг, который образ при сборке правит под непривилегированный запуск:
# listen 80 → 8080 default_server, root → /opt/app-root/src, а pid и временные
# каталоги переносит туда, куда может писать пользователь 1001.
#
# Свой server{} здесь был бы ошибкой: он либо дублировал бы default-server
# на том же порту, либо (при замене /etc/nginx/nginx.conf целиком) заставил бы
# заново решать задачу не-root-запуска, которую образ уже решил.
# =============================================================================

# Лимит тела запроса у интерфейса. У API тот же потолок — файл до
# MAX_FILE_BYTES (100 МиБ, packages/config/src/index.ts), поэтому через
# интерфейс проходит документ того же размера, что и при обращении
# к API напрямую.
client_max_body_size 100m;

# Сжатие статики
#
# Уровень задан явно: по умолчанию nginx сжимает на единице, то есть
# почти не сжимает. Шестёрка отдаёт заметно меньший файл при умеренной
# нагрузке на процессор, а статика здесь отдаётся из кеша и считается
# один раз на версию сборки.
#
# gzip_static не включён: он требует заранее сжатых .gz рядом с файлами,
# а сборка Vite их не создаёт — включать его без них бессмысленно.
gzip on;
gzip_comp_level 6;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# Безопасность статики
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# --- API ---------------------------------------------------------------------
# Маршруты сервиса: /convert/to-pdf, /convert/status/:id и /health.
# Готовый PDF отдаётся не здесь, а presigned-ссылкой прямо из объектного
# хранилища, поэтому /results и /storage больше не проксируются
location ~ ^/(convert|health) {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Постановка задачи отвечает не мгновенно: сервис проверяет
    # zip-контейнер документа, оценивает его сложность и сохраняет файл
    # в хранилище, а конвертация идёт в отдельном контейнере-воркере.
    # 180 секунд — запас на медленную машину, и он больше клиентского
    # таймаута отправки (120 с, web/src/api/client.ts), чтобы клиент
    # сдавался первым и показывал понятную ошибку, а не получал
    # оборванное соединение вместо ответа
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Тело запроса может быть крупным (документ до 100 МиБ) —
    # не буферизуем его целиком на диск
    proxy_request_buffering off;
}

# --- Статика -----------------------------------------------------------------
# Ассеты Vite содержат хеш в имени, поэтому кешируются надолго.
#
# `nosniff` повторяется здесь не для красоты: `add_header` в локации отменяет
# заголовки, заданные на уровне server, а не дополняет их. Без этой строки
# ассеты отдавались бы без запрета на угадывание типа (проверяется в
# tests/local-headers.test.js).
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Оболочка SPA не кешируется: в ней ссылки на актуальные ассеты
location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
}

# --- Браузерная конвертация (страница /local/) --------------------------------
#
# Это отдельный документ, а не раздел интерфейса, и причина в заголовках:
# сборке LibreOffice нужны `Cross-Origin-Opener-Policy` и
# `Cross-Origin-Embedder-Policy`, без которых браузер не выдаёт
# SharedArrayBuffer, — а сборка собрана с pthread и без него не стартует
# вовсе. Интерфейсу сервиса эти заголовки не нужны, и цена у них есть:
# `COOP` обнуляет `opener` у открываемых окон, а `COEP` требует
# `Cross-Origin-Resource-Policy` от **всех** подресурсов документа — то есть
# молча ломает любую загрузку с чужого origin. Платить это за свойства,
# которыми интерфейс не пользуется, незачем.
#
# Каждая локация ниже повторяет базовые заголовки. Это не дублирование,
# а требование nginx: `add_header` в дочерней локации **отменяет**
# унаследованные из server, а не дополняет их. Забудь их здесь — и страница
# останется без `X-Content-Type-Options` молча.

location = /local {
    # Без слэша путь попал бы в SPA-fallback и отдал интерфейс сервиса
    return 301 /local/;
}

location ^~ /local/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Документ не кешируется: в нём ссылки на актуальные ассеты
    add_header Cache-Control "no-store, no-cache, must-revalidate";

    # Без SPA-fallback: неизвестный путь на этой странице — ошибка раздачи,
    # и получить вместо скрипта HTML хуже, чем получить 404
    try_files $uri =404;
}

location ^~ /local/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location = /local/bridge.js {
    # Мост собирается из нашего кода: имя постоянное, содержимое — нет
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location = /local/uno/runtime.js {
    # Перенесённая обвязка UNO: имя постоянное, содержимое — нет
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location ^~ /local/lowa/ {
    # Сборка неизменна в пределах зафиксированной версии (контрольные суммы
    # лежат в apps/web/lowa/assets.sha256, а версия меняется осознанно)
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;

    # Заранее сжатые копии: распакованный wasm — 154 МБ, сжатый — 51 МБ.
    # Сжатие на лету стоило бы процессорного времени на каждый запрос,
    # а кеша сжатого у nginx без proxy_cache нет.
    gzip_static on;

    try_files $uri =404;
}

# SPA-fallback: любой неизвестный путь отдаёт index.html,
# чтобы работала навигация на стороне клиента
location / {
    try_files $uri $uri/ /index.html;
}
