# =============================================================================
# Конфигурация nginx для веб-интерфейса конвертера
#
# nginx — единственная точка входа: отдаёт статику и проксирует запросы
# к API. Благодаря этому фронтенд и API находятся на одном origin, и CORS
# (который у сервиса включается только в режиме development) не нужен.
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит тела запроса у интерфейса. У API тот же потолок — файл до
    # MAX_FILE_BYTES (100 МиБ, src/config/index.ts), поэтому через интерфейс
    # проходит книга того же размера, что и при обращении к API напрямую.
    client_max_body_size 100m;

    # Сжатие статики
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Безопасность статики
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # --- API -----------------------------------------------------------------
    # Маршруты сервиса: /convert/xlsx-to-pdf, /convert/status/:id и /health.
    # Готовый PDF отдаётся не здесь, а presigned-ссылкой прямо из объектного
    # хранилища, поэтому /results и /storage больше не проксируются
    location ~ ^/(convert|health) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Постановка задачи отвечает не мгновенно: сервис проверяет
        # zip-контейнер книги, оценивает её сложность и сохраняет файл
        # в хранилище, а конвертация идёт в отдельном контейнере-воркере.
        # 180 секунд — запас на медленную машину, и он больше клиентского
        # таймаута отправки (120 с, web/src/api/client.ts), чтобы клиент
        # сдавался первым и показывал понятную ошибку, а не получал
        # оборванное соединение вместо ответа
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        # Тело запроса может быть крупным (книга до 100 МиБ) —
        # не буферизуем его целиком на диск
        proxy_request_buffering off;
    }

    # --- Статика -------------------------------------------------------------
    # Ассеты Vite содержат хеш в имени, поэтому кешируются надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Оболочка SPA не кешируется: в ней ссылки на актуальные ассеты
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA-fallback: любой неизвестный путь отдаёт index.html,
    # чтобы работала навигация на стороне клиента
    location / {
        try_files $uri $uri/ /index.html;
    }
}
