<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Конвертация в браузере</title>
    <!--
      Отдельный документ, а не раздел интерфейса, и это не стилистика:
      сборке LibreOffice нужны заголовки `Cross-Origin-Opener-Policy` и
      `Cross-Origin-Embedder-Policy`, без которых браузер не выдаёт
      SharedArrayBuffer. Заголовки принадлежат документу, поэтому страница
      сервиса остаётся без них: иначе вместе с изоляцией отвалились бы
      ссылки на результаты в MinIO — они ведут на другой origin.
    -->
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <!--
      Canvas существует с самого начала, хотя сборка загружается по нажатию:
      она ищет элемент по идентификатору в момент инициализации, а созданный
      позже элемент до неё не дойдёт. Идентификатор `qtcanvas` задан не нами —
      его требует Qt-бэкенд сборки.
    -->
    <canvas id="qtcanvas" class="preview__canvas" width="1200" height="800"></canvas>

    <div id="root"></div>

    <script type="module" src="./main.tsx"></script>
  </body>
</html>
