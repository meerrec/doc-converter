<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Конвертация книг Excel (XLSX) и документов Word (DOCX) в PDF: водяной знак, версии PDF и PDF/A, защита паролем"
    />
    <title>Конвертер документов в PDF</title>
  </head>
  <body>
    <!--
      Canvas существует с самого начала, хотя сборка LibreOffice загружается
      по нажатию: она ищет элемент по идентификатору в момент инициализации,
      а созданный позже элемент до неё не дойдёт. Идентификатор `qtcanvas`
      задан не нами — его требует Qt-бэкенд сборки.

      Лежит он в документе, а не в разметке React, по той же причине:
      панель предпросмотра лишь переносит узел в свой слот, а удаление узла
      при перерисовке оставило бы запущенный офис без цели для рисования.
    -->
    <canvas id="qtcanvas" class="preview__canvas" width="1200" height="800"></canvas>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
