# =============================================================================
# docker-compose.yml сервиса конвертации XLSX → PDF.
#
# Архитектура:
#   - api         — приём файлов, постановка задач, выдача статусов и ссылок
#   - uno-worker  — контейнеры с LibreOffice Calc и UNO-бриджем (по одному
#                   soffice на контейнер, concurrency: 1)
#   - autoscaler  — поднимает и гасит реплики воркеров по длине очередей
#   - minio       — объектное хранилище входных файлов и результатов
#   - valkey      — очередь BullMQ и состояние задач
#   - web         — интерфейс и реверс-прокси к api
#
# Воркеры по уровням сложности: light / medium / heavy. Одна реплика
# обслуживает одну очередь — иначе разделение по сложности теряет смысл,
# а параллелизм внутри реплики невозможен (UNO не потокобезопасен).
#
# Память:
#   - memswap_limit == mem_limit => swap ВЫКЛЮЧЕН. При нехватке памяти
#     контейнер убивается OOM-killer'ом, а не деградирует в swap.
#     Значения менять ТОЛЬКО парой.
#   - Реплика воркера держит LibreOffice: 400–600 МБ в покое и заметно
#     больше на пике конвертации большой книги (см. WORKER_MEMORY_LIMIT_MB).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: doc-converter-api
    restart: unless-stopped
    networks:
      - converter
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0

      # Valkey / Redis
      - REDIS_HOST=valkey
      - REDIS_PORT=6379

      # Объектное хранилище
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=conversions
      # Presigned-ссылка подписывается вместе с хостом, поэтому клиенту
      # отдаётся публичный адрес: имя `minio` резолвится только внутри сети
      # compose, и браузер по такой ссылке не пошёл бы
      - S3_PUBLIC_ENDPOINT=localhost
      - S3_PUBLIC_PORT=9000

      # Таймауты и лимиты
      - MAX_FILE_BYTES=104857600
      - CONVERSION_TIMEOUT_MS=120000
      - PRESIGN_EXPIRY_SEC=3600
      - JOB_TTL_SEC=86400

      # Ограничитель частоты
      - RATE_PER_SEC=5
      - RATE_BURST=20
      # Перед api ровно один прокси (nginx) — доверяем его заголовку
      # X-Forwarded-For. Без этого req.ip у всех клиентов равен адресу
      # контейнера nginx, и все они делят одно ведро ограничителя
      - TRUST_PROXY=1

      # Логирование
      - LOG_LEVEL=info
      - AUDIT_LOG_PATH=/var/log/converter/audit.log
    volumes:
      - audit-log:/var/log/converter
    ports:
      # Только loopback: при TRUST_PROXY=1 клиент, дотянувшийся до порта
      # напрямую, подставил бы в X-Forwarded-For чужой адрес и обошёл
      # ограничитель частоты. Наружу API отдаёт nginx (сервис web)
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    depends_on:
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/dist/nest/health/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Воркеры по уровням сложности
  # ---------------------------------------------------------------------------
  # Стартовые реплики: по одной на очередь. Их поднимает compose, а
  # дополнительные создаёт autoscaler через Docker API — помеченные меткой
  # `doc-converter.managed`, поэтому он никогда не удалит контейнеры compose
  # (иначе `restart: unless-stopped` возвращал бы их обратно, и autoscaler
  # бесконечно боролся бы с compose).
  #
  # Отдельный якорь на общие настройки воркера — три сервиса отличаются
  # только очередью.
  uno-worker-light: &uno-worker
    build:
      context: .
      dockerfile: Dockerfile.uno-worker
    # Имя образа задано явно: по умолчанию compose назвал бы его
    # по сервису (doc-converter-uno-worker-light), а autoscaler поднимает
    # реплики из AUTOSCALER_WORKER_IMAGE. Один образ на все три очереди —
    # они отличаются только переменной WORKER_QUEUE
    image: doc-converter-uno-worker:latest
    restart: unless-stopped
    networks:
      - converter
    environment:
      - NODE_ENV=production
      - WORKER_QUEUE=light
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=conversions
      - UNO_PORT=2002
      - CONVERSION_TIMEOUT_MS=120000
      - LOG_LEVEL=info
      # Домашний каталог в tmpfs: fontconfig пишет кэш шрифтов в ~/.cache,
      # а корневая ФС только для чтения — без этого он ругается на каждой
      # конвертации и каждый раз пересканирует шрифты
      - HOME=/tmp
    labels:
      # Метки нужны autoscaler'у: по ним он видит стартовые реплики compose
      doc-converter.role: uno-worker
      doc-converter.tier: light
    read_only: true
    tmpfs:
      # Профиль LibreOffice и временные файлы задач живут здесь: корневая
      # ФС только для чтения, а soffice обязан писать в профиль
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Пик конвертации большой книги: сам процесс LibreOffice, документ
    # в памяти и копия при экспорте
    mem_limit: 2g
    memswap_limit: 2g
    cpus: "1.0"
    depends_on:
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy

  uno-worker-medium:
    <<: *uno-worker
    environment:
      - NODE_ENV=production
      - WORKER_QUEUE=medium
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=conversions
      - UNO_PORT=2002
      - CONVERSION_TIMEOUT_MS=120000
      - LOG_LEVEL=info
      - HOME=/tmp
    labels:
      doc-converter.role: uno-worker
      doc-converter.tier: medium

  uno-worker-heavy:
    <<: *uno-worker
    environment:
      - NODE_ENV=production
      - WORKER_QUEUE=heavy
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=conversions
      - UNO_PORT=2002
      # Тяжёлым книгам даётся вдвое больший бюджет: одна такая конвертация
      # занимает реплику целиком, и таймаут на них срабатывал бы ложно
      - CONVERSION_TIMEOUT_MS=300000
      - LOG_LEVEL=info
      - HOME=/tmp
    labels:
      doc-converter.role: uno-worker
      doc-converter.tier: heavy

  # ---------------------------------------------------------------------------
  # Autoscaler (локальная замена KEDA)
  # ---------------------------------------------------------------------------
  # В Kubernetes эту роль играет KEDA (см. deploy/k8s/scaledobject-*.yaml),
  # и этот сервис там не нужен. В compose масштабировать сервис по метрике
  # нечем, поэтому реплики создаются через Docker API.
  #
  # ВНИМАНИЕ: монтирование docker.sock даёт контейнеру root-эквивалент
  # на хосте — через API можно создать привилегированный контейнер
  # с корневой ФС хоста. Это осознанная плата за автомасштабирование
  # в compose; в K8s доступ к сокету не нужен вовсе.
  autoscaler:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: doc-converter-autoscaler
    restart: unless-stopped
    networks:
      - converter
    command: ["node", "/app/dist/autoscaler/index.js"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=conversions
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      # Образ и сеть, из которых поднимаются реплики
      - AUTOSCALER_WORKER_IMAGE=doc-converter-uno-worker:latest
      - AUTOSCALER_NETWORK=doc-converter_converter
      - AUTOSCALER_POLL_INTERVAL_MS=15000
      - AUTOSCALER_MAX_STEP=1
      # Бюджеты конвертации для создаваемых реплик: должны совпадать
      # со значениями у сервисов воркеров выше
      - CONVERSION_TIMEOUT_MS=120000
      - CONVERSION_TIMEOUT_MS_HEAVY=300000
      - WORKER_MEMORY_LIMIT_MB=2048
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Пользователь conv не входит в группу docker хоста: без этого
    # обращение к сокету отвергается по правам. GID задаётся в .env
    # (`DOCKER_GID`), потому что он платформенно-зависим
    # GID сокета зависит от платформы: на Linux это группа docker (обычно 998
    # или 999), на macOS в Docker Desktop сокет принадлежит root:root.
    # Значение задаётся в .env (см. .env.example)
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Web-интерфейс и реверс-прокси
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    networks:
      - converter
    ports:
      - "8080:8080"
    depends_on:
      # Условие service_healthy не нужно: интерфейс — статика, запросы nginx
      # проксирует лениво, и здоровье API к первому запросу не требуется
      - api

  # ---------------------------------------------------------------------------
  # Объектное хранилище
  # ---------------------------------------------------------------------------
  minio:
    # Образ берётся с quay.io: MinIO прекратила публикацию на Docker Hub,
    # и `minio/minio` там больше не существует (pull завершается
    # «pull access denied»). Зеркало на quay.io — официальное
    image: quay.io/minio/minio:latest
    container_name: doc-converter-minio
    restart: unless-stopped
    networks:
      - converter
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    ports:
      # 9000 — API (нужен клиенту, чтобы открыть presigned-ссылку),
      # 9001 — консоль
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Одноразовый сервис: создаёт бакет и завершается. Отдельным сервисом,
  # а не проверкой внутри api, потому что бакет нужен и воркерам, а гонка
  # «создать при первом обращении» в нескольких процессах даёт ошибку
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: doc-converter-minio-init
    networks:
      - converter
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/conversions &&
        echo "Бакет conversions готов"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Valkey (Redis-совместимый)
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.1
    container_name: doc-converter-valkey
    restart: unless-stopped
    networks:
      - converter
    volumes:
      - valkey-data:/data
    # Политика noeviction, а не вытеснение: потеря ключей BullMQ — это
    # молчаливая потеря задач. С noeviction Valkey вернёт ошибку на запись,
    # и API отдаст 503 — видимая деградация вместо OOM-kill, уносящего очередь.
    # --save "" отключает RDB-снимки: при включённом AOF они дублируют форк
    # и его COW-страницы.
    command: ["valkey-server", "--appendonly", "yes", "--protected-mode", "no",
              "--maxmemory", "400mb", "--maxmemory-policy", "noeviction",
              "--maxmemory-clients", "64mb", "--save", ""]
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: false
    tmpfs:
      - /tmp:size=100m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  converter:
    # Явное имя: autoscaler подключает к этой сети создаваемые им реплики,
    # а имя по умолчанию зависит от имени каталога проекта
    name: doc-converter_converter

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  valkey-data:
    name: doc-converter-valkey-data
  minio-data:
    name: doc-converter-minio-data
  audit-log:
    name: doc-converter-audit-log
