# =============================================================================
# docker-compose.yml для сервиса конвертации документов
#
# Архитектура:
#   - API сервер (NestJS) на порту 3000
#   - Worker процесс для асинхронной обработки
#   - Valkey как брокер очереди и хранилище идемпотентности
#
# Сеть:
#   - converter: внутренняя сеть (internal: true)
#   - Нет доступа наружу для worker и valkey
#
# Безопасность:
#   - Все контейнеры non-root
#   - cap_drop: ALL
#   - read_only: true
#   - no-new-privileges: true
#   - tmpfs для временных файлов
#
# Память:
#   - memswap_limit == mem_limit => swap ВЫКЛЮЧЕН. Это осознанно: при
#     нехватке памяти контейнер убивается OOM-killer'ом, а не деградирует
#     в swap. Значения менять ТОЛЬКО парой — если mem_limit окажется
#     больше memswap_limit, контейнер не стартует с ошибкой
#     "Minimum memoryswap limit should be larger than memory limit".
#   - tmpfs учитывается в mem_limit (shmem в memory cgroup), т.е.
#     /tmp:size=512m съедает до 512 МБ из лимита контейнера.
#   - Потолок памяти родительского процесса задаёт fork-пул: каждый форк
#     получает свой --max-old-space-size, то есть MAX_CONCURRENT x 1536 МБ
#     heap. Отдельного бюджета на изолят больше нет — от isolated-vm
#     отказались, оба пути (sync и async) идут через fork-пул.
#   - version: '3.8' убран намеренно: поле obsolete в Compose v2, а в схеме
#     v3 mem_limit/memswap_limit МОЛЧА игнорируются при docker stack deploy.
#     Для Swarm-деплоя нужен deploy.resources.limits.memory (не дублировать
#     оба ключа в одном файле — какой из них победит, не документировано).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-converter-api
    restart: unless-stopped
    networks:
      - converter
    environment:
      # Общие настройки
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0

      # Valkey / Redis
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CONNECTION_STRING=redis://valkey:6379/0

      # Storage
      # Том монтируется в /data целиком, а каталоги разделены: результаты —
      # /data/storage, входные файлы очереди — /data/incoming. Разделение
      # обязательно: имена результатов собираются как {taskId}.{ext}, где
      # taskId — клиентский `key`, поэтому входной документ в общем каталоге
      # стал бы доступен по GET /results/{key}.{ext}
      - STORAGE_PATH=/data/storage
      - INPUT_STORAGE_PATH=/data/incoming

      # WASM и конвертация
      - SYNC_ENABLED=true

      # Таймауты
      - SYNC_TIMEOUT_MS=30000
      - SYNC_QUEUE_WAIT_MS=5000
      - REQUEST_BODY_TIMEOUT_MS=15000
      - FETCH_TIMEOUT_MS=30000
      - VALIDATION_TIMEOUT_MS=10000
      - STORAGE_WRITE_TIMEOUT_MS=5000
      - JOB_TIMEOUT_MS=60000

      # Rate Limiting
      - RATE_PER_SEC=5
      - RATE_BURST=20
      # Перед api ровно один прокси (nginx) — доверяем его заголовку
      # X-Forwarded-For. Без этого req.ip у всех клиентов равен адресу
      # контейнера nginx, и все они делят одно ведро ограничителя частоты
      - TRUST_PROXY=1

      # Fork Pool.
      # 2 — предел по памяти: библиотека конвертера 2.x держит ~1.16 ГБ на
      # процесс, а контейнеру отведено 3 ГБ (см. mem_limit ниже)
      - FORK_POOL_SIZE=2
      - MAX_CONCURRENT=2

      # BullMQ
      - BULLMQ_LOCK_DURATION=120000
      - BULLMQ_STALLED_INTERVAL=60000
      - BULLMQ_MAX_STALLED_COUNT=1

      # Логирование
      - LOG_LEVEL=info
      - AUDIT_LOG_PATH=/var/log/converter/audit.log

      # Идемпотентность
      - IDEMPOTENCY_TTL_SEC=3600

      # Node.js опции
      - NODE_OPTIONS=--disable-wasm-trap-handler --max-old-space-size=1536 --unhandled-rejections=strict
    volumes:
      # Том общий с worker: через него передаётся входной файл очереди
      - storage-data:/data
      - audit-log:/var/log/converter
    ports:
      # Только на loopback: при TRUST_PROXY=1 клиент, дотянувшийся до порта
      # напрямую, подставил бы в X-Forwarded-For чужой адрес и обошёл
      # ограничитель частоты. Наружу API отдаёт nginx (сервис web)
      - "127.0.0.1:3000:3000"
    # Hardening
    user: conv
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # 3g — паритет с worker. api обслуживает sync-конвертацию через тот же
    # fork-пул (http/convert.controller.ts -> sandbox.js), и конфигурация пулов
    # идентична: FORK_POOL_SIZE=2, MAX_CONCURRENT=2 — по ~1.16 ГБ на процесс.
    # mem_limit и memswap_limit держать равными (swap off, см. заголовок).
    mem_limit: 3g
    memswap_limit: 3g
    # 2.0 — паритет с worker. При одном ядре синхронная конвертация не
    # укладывается в SYNC_TIMEOUT_MS: инициализация WASM (чтение ассетов и
    # сканирование шрифтов) на одном ядре занимает больше 30 с, и запрос
    # падает с sync_timeout. Проверено: с 2.0 тот же запрос проходит за 3 с
    cpus: "2.0"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/dist/nest/health/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Web Interface
  # ---------------------------------------------------------------------------
  # nginx раздаёт собранный интерфейс и проксирует API на сервис api.
  # Благодаря общему origin (порт 8080) CORS не нужен: у сервиса он
  # включается только при NODE_ENV=development.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile

    restart: unless-stopped
    networks:
      - converter
    ports:
      # 8080, чтобы не конфликтовать с опубликованным портом API (3000)
      - "8080:8080"
    depends_on:
      # Условие service_healthy здесь не нужно: интерфейс — статика, запросы
      # nginx проксирует лениво, и здоровье API к моменту первого запроса
      # не требуется. Healthcheck API при этом рабочий (см. сервис api).
      - api

  # ---------------------------------------------------------------------------
  # Worker Process
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - converter
    environment:
      # Общие настройки
      - NODE_ENV=production

      # Valkey / Redis
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CONNECTION_STRING=redis://valkey:6379/0

      # Storage
      - STORAGE_PATH=/data/storage
      - INPUT_STORAGE_PATH=/data/incoming

      # WASM и конвертация
      - SYNC_ENABLED=false

      # Таймауты
      - JOB_TIMEOUT_MS=60000

      # Fork Pool.
      # 2 — предел по памяти: библиотека конвертера 2.x держит ~1.16 ГБ на
      # процесс, а контейнеру отведено 3 ГБ (см. mem_limit ниже)
      - FORK_POOL_SIZE=2
      - MAX_CONCURRENT=2

      # BullMQ
      - BULLMQ_LOCK_DURATION=120000
      - BULLMQ_STALLED_INTERVAL=60000
      - BULLMQ_MAX_STALLED_COUNT=1

      # Логирование
      - LOG_LEVEL=info
      - AUDIT_LOG_PATH=/var/log/converter/audit.log

      # Node.js опции для worker
      # --max-old-space-size=1536: лимит heap V8
      # --disable-wasm-trap-handler: совместимость с mem_limit
      - NODE_OPTIONS=--disable-wasm-trap-handler --max-old-space-size=1536 --unhandled-rejections=strict
    volumes:
      # Тот же том, что у api: воркер читает входной файл по пути из задачи
      - storage-data:/data
      - audit-log:/var/log/converter
    # Hardening
    user: conv
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # ВНИМАНИЕ: fork-pool.js задаёт КАЖДОМУ форку --max-old-space-size=1536,
    # а библиотека конвертера 2.x добавляет к этому ~1.16 ГБ RSS на процесс
    # (замерено). 3g покрывает 2 одновременные задачи (MAX_CONCURRENT=2);
    # при насыщении пула сработает OOM-killer. Это осознанный backstop
    # (fork-pool.js: "Ограничение по памяти будет через Docker cgroups"),
    # но при разборе OOM в первую очередь смотреть на MAX_CONCURRENT,
    # а не на mem_limit.
    # mem_limit и memswap_limit держать равными (swap off, см. заголовок).
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "2.0"
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    depends_on:
      valkey:
        condition: service_healthy
    # Worker запускает отдельный процесс (собранный: исходники на TypeScript)
    command: ["node", "/app/dist/worker/index.js"]
    # HEALTHCHECK из образа воркеру не нужен: он проверяет доступность Valkey,
    # но запускается отдельным процессом, который каждые 30 секунд поднимает
    # новое соединение. Доступность Valkey и так видна по самому воркеру
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Valkey (Redis-compatible)
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.1
    restart: unless-stopped
    networks:
      - converter
    volumes:
      - valkey-data:/data
    # maxmemory 400mb при mem_limit 512m: запас на фрагментацию и COW-страницы
    # перезаписи AOF (см. обоснование лимита памяти ниже).
    # Политика именно noeviction, а не allkeys-lru: вытеснение ключей BullMQ —
    # это молчаливая потеря задач. С noeviction Valkey вернёт ошибку на запись,
    # и API отдаст 503 — видимая деградация вместо OOM-kill, уносящего очередь.
    #
    # maxmemory-clients 64mb — страховка от одного жадного читателя: без неё
    # клиент, запросивший разом много ключей, выедает память в обход maxmemory
    # (буферы ответов в этот счёт не входят). --save "" отключает RDB-снимки:
    # при включённом AOF они дублируют форк и его COW-страницы.
    command: ["valkey-server", "--appendonly", "yes", "--protected-mode", "no",
              "--maxmemory", "400mb", "--maxmemory-policy", "noeviction",
              "--maxmemory-clients", "64mb", "--save", ""]
    # Valkey требует дополнительных capabilities для сохранения данных
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: false
    tmpfs:
      - /tmp:size=100m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    # 512m при appendonly yes: перезапись AOF форкается, и COW-страницы
    # прибавляются к этому же лимиту, внутри которого уже лежит tmpfs на 100m.
    # mem_limit и memswap_limit держать равными (swap off, см. заголовок).
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.5"
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  converter:

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  valkey-data:
    name: doc-converter-valkey-data
  storage-data:
    name: doc-converter-storage-data
  audit-log:
    name: doc-converter-audit-log
