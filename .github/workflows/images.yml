# =============================================================================
# Сборка образов: проверяется, что Dockerfile'ы собираются.
#
# Образы никуда не публикуются (`push: false`): workflow отвечает не за доставку,
# а за то, чтобы правка исходников, манифестов или самого Dockerfile не сломала
# сборку образа. Публикация в registry появится вместе с развёртыванием
# и будет отдельным шагом: сейчас у сервиса нет ни registry, ни среды,
# куда образы кладутся, — а проверка сборки полезна уже сейчас.
#
# Почему это отдельный workflow, а не job в ci.yml: сборка воркера тянет
# LibreOffice Calc и занимает минуты, тогда как проверки кода — секунды.
# Разные по цене вещи не должны блокировать друг друга в одном прогоне.
#
# Образ воркера — самый тяжёлый (LibreOffice Calc, python3-uno и шрифты,
# порядка 700 МБ), поэтому его слои кешируются в кеше GitHub Actions:
# слой с apt-пакетами пересобирается только при правке Dockerfile.
# =============================================================================

name: Образы

on:
  push:
    branches: [main]
    # Список продублирован в обоих триггерах, а не вынесен в YAML-якорь:
    # якоря Actions понимает, но читаемость файла от них страдает, а список
    # короткий. Держать копии синхронными обязательно — иначе проверка
    # запустится лишний раз или не запустится вовсе.
    #
    # Что не игнорируется: `.dockerignore` (меняет контекст сборки),
    # `.github/**` (правка самого workflow обязана его запускать),
    # манифесты, замок и конфиги TypeScript.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'deploy/**'
      - 'tests/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'deploy/**'
      - 'tests/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# ВНИМАНИЕ: из-за фильтра по путям на pull request только с документацией
# этот workflow не запускается вовсе — статуса у такого PR не будет. Помечать
# проверку обязательной в branch protection можно, только сняв фильтр
# (иначе PR с правкой README останется без статуса и не вльётся).
# Обязательной здесь логичнее держать проверку из ci.yml — она идёт всегда.

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Конфигурация compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v7

      # `config -q` разбирает файл вместе с интерполяцией переменных и ничего
      # не печатает. Поднимать compose целиком в CI незачем: сервисам нужны
      # собранный образ воркера и docker.sock хоста, а проверяется здесь
      # ровно одно — что docker-compose.yml разбирается.
      - name: Разобрать конфигурацию compose
        run: docker compose config -q

  images:
    name: Образ ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      # Упавшая сборка одного образа не отменяет остальные: видеть состояние
      # всех трёх сразу полезнее, чем узнать про вторую поломку после починки
      # первой.
      fail-fast: false
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile
          - image: web
            file: apps/web/Dockerfile
          - image: uno-worker
            file: apps/worker/Dockerfile

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Buildx
        uses: docker/setup-buildx-action@v4

      - name: Собрать образ
        uses: docker/build-push-action@v7
        with:
          # Контекст — корень репозитория: Dockerfile'ы копируют манифесты всего
          # workspace (pnpm сверяет состав проектов с замком) и собирают пакеты
          # по графу зависимостей, а не только своё приложение.
          context: .
          file: ${{ matrix.file }}
          push: false
          # Область кеша своя у каждого образа: слои api и web не пересекаются
          # с воркером, а общий scope вытеснял бы их друг другом.
          #
          # mode=max кеширует и промежуточные стадии (builder с установкой
          # зависимостей), а не только финальный образ: именно они дороже
          # всего пересобираются.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
