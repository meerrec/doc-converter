# =============================================================================
# Непрерывная интеграция: сборка, типы, тесты.
#
# Набор шагов повторяет то, что разработчик делает перед коммитом, и не больше:
#   pnpm ci            — установка строго по замку (clean + --frozen-lockfile)
#   pnpm -r build      — пакеты, затем приложения, по графу зависимостей
#   pnpm -r typecheck  — tsc --noEmit во всех пакетах
#   pnpm lint          — ESLint
#   pnpm test          — Vitest
#
# Сверх этого — один шаг, которого нет в локальном наборе: проверка размера
# собранного веб-бандла. Валидатор zod весит четверть бандла, и вернуть его
# можно одной случайной строкой импорта, ничего не заметив: сборка, типы
# и тесты такую регрессию пропускают. Порог заведомо свободный и служит
# не экономии, а сигналу «в бандл приехало что-то крупное».
#
# Service-контейнеры (Valkey, MinIO) здесь не поднимаются намеренно: тесты
# проверяют то, что сервис обязан отсеять до обращения к инфраструктуре,
# и проходят без неё (tests/, CLAUDE.md). Живая конвертация — предмет
# отдельного интеграционного прогона в окружении с LibreOffice, а не этого
# workflow: поднимать здесь образ воркера на 1,3 ГБ ради проверки кода,
# который от LibreOffice не зависит, незачем.
#
# Версии инструментов берутся из репозитория, а не из настроек раннера:
# pnpm — из поля `packageManager` (pnpm/action-setup читает его сам),
# Node — 24, как в Dockerfile'ах (ubi9/nodejs-24) и в engines.node.
# Так CI и образы собираются одним и тем же инструментом: расхождение
# «в CI зелено, в контейнере падает» здесь невозможно по построению.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: проверять устаревший
# коммит незачем, а место в очереди раннеров он занимает.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Токену больше прав не нужно: workflow только читает репозиторий.
permissions:
  contents: read

jobs:
  verify:
    name: Сборка, типы, тесты
    runs-on: ubuntu-latest
    # Потолок на случай зависшего шага, а не бюджет: установка, сборка
    # и тесты укладываются в пару минут, и упереться в потолок означает
    # поломку, а не медленный раннер.
    timeout-minutes: 20

    steps:
      - name: Клонировать репозиторий
        uses: actions/checkout@v7

      # До setup-node: `cache: pnpm` спрашивает у pnpm путь до хранилища,
      # и без установленного pnpm этот шаг падает.
      - name: Установить pnpm
        uses: pnpm/action-setup@v6
        # Версия намеренно не указана: она берётся из `packageManager`
        # в package.json — из того же места, откуда её читает corepack
        # в Dockerfile'ах. Второго источника версии не заводим.

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Кешируется хранилище pnpm (не node_modules): ключ считается
          # по pnpm-lock.yaml, поэтому смена любой зависимости пересобирает
          # кеш, а правка исходников его не трогает.
          cache: pnpm

      # `pnpm ci` — это clean + install --frozen-lockfile. Замок обязан
      # совпадать с манифестами: правка зависимости без обновления
      # pnpm-lock.yaml не проедет. Флаг --frozen-lockfile здесь не дублируется,
      # он входит в саму команду.
      - name: Установить зависимости
        run: pnpm ci

      - name: Собрать пакеты и приложения
        run: pnpm -r build

      # Отдельным шагом и после сборки: `tsc --noEmit` в приложениях и вебе
      # резолвит типы workspace-пакетов через их dist, поэтому проверка типов
      # до сборки упала бы на несуществующих .d.ts. Команда `npm run typecheck`
      # собирала бы проект второй раз — здесь шаги разведены, и по упавшему
      # шагу сразу видно, что сломалось: сборка или типы.
      - name: Проверить типы
        run: pnpm -r typecheck

      - name: Проверить стиль
        run: pnpm lint

      - name: Прогнать тесты
        run: pnpm test

      # Потолок в 300 КБ при текущих ~254 КБ: запас на рост приложения, но
      # не на возврат валидатора (~85 КБ). Число в килобайтах — не цель,
      # а граница, за которой правку нужно осознать.
      - name: Проверить размер веб-бандла
        run: |
          set -eu
          bundle=$(ls apps/web/dist/assets/*.js)
          size=$(wc -c < "$bundle")
          echo "Веб-бандл: $bundle — $size байт"
          if [ "$size" -gt 307200 ]; then
            echo "Бандл превысил 300 КБ: проверьте, не вернулся ли zod или другая крупная зависимость"
            exit 1
          fi

      # Скрипты в docker/ не покрыты ни сборкой, ни тестами: UNO-скрипт
      # исполняется только внутри образа с LibreOffice, entrypoint — только
      # в контейнере. Проверяется то, что проверяемо без них, — синтаксис:
      # опечатка здесь ломает контейнер, а не сборку, и всплыла бы только
      # при живой конвертации.
      #
      # py_compile оставляет рядом со скриптом __pycache__ — в CI это безвредно,
      # но убирается, чтобы шаг не оставлял мусора в рабочей копии.
      - name: Проверить синтаксис скриптов в docker/
        run: |
          python3 -m py_compile docker/uno/uno_convert.py
          rm -rf docker/uno/__pycache__
          sh -n docker/uno/worker-entrypoint.sh
