# =============================================================================
# KEDA ScaledObject для очереди «тяжёлых» задач.
#
# Самая осторожная политика из трёх: одна задача — одна реплика
# (listLength: 1), максимум три реплики и длительное остывание.
#
# Почему так: тяжёлая конвертация занимает минуты и держит LibreOffice
# с большим документом в памяти. Очередь из двух таких задач означает, что
# вторая прождёт минуты, поэтому вторая реплика нужна сразу; но каждая
# реплика стоит сотни мегабайт, и «на всякий случай» их держать нельзя.
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: uno-worker-heavy
  namespace: doc-converter
spec:
  scaleTargetRef:
    name: uno-worker-heavy

  pollingInterval: 15

  # 10 минут: погасить и снова поднять тяжёлую реплику дороже, чем
  # подождать — повторный холодный старт плюс прогрев импорта
  cooldownPeriod: 600

  minReplicaCount: 1
  maxReplicaCount: 3

  triggers:
    - type: redis
      metadata:
        address: valkey:6379
        listName: "bull:xlsx2pdf.heavy:wait"
        # Одна задача на реплику: параллелизм внутри реплики невозможен,
        # а очередь из двух задач уже превышает время, которое клиент
        # готов ждать
        listLength: "1"
        activationListLength: "1"
        enableTLS: "false"
