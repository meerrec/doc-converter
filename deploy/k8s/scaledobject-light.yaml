# =============================================================================
# KEDA ScaledObject для очереди «лёгких» задач.
#
# В Kubernetes автомасштабирование делает KEDA, а не сервис autoscaler
# из docker-compose: он нужен только там, где нет ничего, что умеет
# масштабировать по внешней метрике. Доступ к docker.sock в K8s не нужен.
#
# Одна реплика — один soffice — одна конвертация одновременно: UNO
# не потокобезопасен, параллелизм внутри реплики невозможен.
# =============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: uno-worker-light
  namespace: doc-converter
spec:
  scaleTargetRef:
    # Deployment воркеров лёгкой очереди (манифест приложения)
    name: uno-worker-light

  # Как часто KEDA опрашивает очередь. 15 с — компромисс между задержкой
  # появления свободного воркера и нагрузкой на Redis
  pollingInterval: 15

  # Время остывания перед снижением: очередь, разобранная за секунды,
  # не должна приводить к удалению и немедленному подъёму реплики
  cooldownPeriod: 120

  # Лёгкие задачи короткие: в простое реплик может не быть вовсе,
  # холодный старт (~3 с) незаметен на фоне ожидания
  minReplicaCount: 0
  maxReplicaCount: 10

  triggers:
    - type: redis
      metadata:
        address: valkey:6379
        # BullMQ хранит ожидающие задачи в списке bull:<queue>:wait
        listName: "bull:xlsx2pdf.light:wait"
        # Пять задач в очереди оправдывают одну реплику: одна лёгкая
        # конвертация занимает секунды, и держать под каждую задачу
        # отдельный LibreOffice дороже, чем подождать
        listLength: "5"
        # Не поднимать реплику с нуля из-за единственной задачи в моменте
        activationListLength: "1"
        enableTLS: "false"
