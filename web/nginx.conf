# =============================================================================
# Конфигурация nginx для веб-интерфейса конвертера
#
# nginx — единственная точка входа: отдаёт статику и проксирует запросы
# к API. Благодаря этому фронтенд и API находятся на одном origin, и CORS
# (который у сервиса включается только в режиме development) не нужен.
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит тела запроса согласован с express.json({ limit: '50mb' })
    # на маршруте конвертации (src/api/routes/convert.js)
    client_max_body_size 50m;

    # Сжатие статики
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Безопасность статики
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # --- API -----------------------------------------------------------------
    # Регулярное выражение покрывает все маршруты сервиса:
    # /ConvertService.ashx, /status, /health, /results, /storage/results
    location ~ ^/(ConvertService\.ashx|status|health|results|storage) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Больше SYNC_TIMEOUT_MS (30 с) у сервиса: иначе клиент получит
        # оборванное соединение вместо аккуратного 504
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Тело запроса может быть крупным (документы в base64) —
        # не буферизуем его целиком на диск
        proxy_request_buffering off;
    }

    # --- Статика -------------------------------------------------------------
    # Ассеты Vite содержат хеш в имени, поэтому кешируются надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Оболочка SPA не кешируется: в ней ссылки на актуальные ассеты
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA-fallback: любой неизвестный путь отдаёт index.html,
    # чтобы работала навигация на стороне клиента
    location / {
        try_files $uri $uri/ /index.html;
    }
}
